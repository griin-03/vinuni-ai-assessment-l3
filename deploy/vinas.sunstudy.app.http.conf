# Bootstrap HTTP virtual host; use while issuing the first certificate only.
server {
    listen 80;
    listen [::]:80;
    server_name vinas.sunstudy.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://vinas.sunstudy.app$request_uri;
    }
}
