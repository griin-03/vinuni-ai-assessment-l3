# VinAssess only: do not edit the virtual hosts for existing products.
server {
    listen 80;
    listen [::]:80;
    server_name vinas.sunstudy.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://vinas.sunstudy.app$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vinas.sunstudy.app;

    ssl_certificate /etc/letsencrypt/live/vinas.sunstudy.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vinas.sunstudy.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VinAssessTLS:1m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/vinassess-access.log;
    error_log /var/log/nginx/vinassess-error.log;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
}
